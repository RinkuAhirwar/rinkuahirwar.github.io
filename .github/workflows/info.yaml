name: Repository Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-repository:
    name: Inspect Repository Contents
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Display the working directory
      - name: Show working directory
        run: |
          echo "=================================="
          echo "WORKING DIRECTORY"
          echo "=================================="
          pwd
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workspace: $GITHUB_WORKSPACE"

      # Step 3: List top-level files and folders
      - name: List root directory
        run: |
          echo "=================================="
          echo "ROOT DIRECTORY CONTENTS"
          echo "=================================="
          ls -la

      # Step 4: List all repository folders
      - name: List repository folders
        run: |
          echo "=================================="
          echo "ALL FOLDERS"
          echo "=================================="
          find . -path './.git' -prune -o -type d -print

      # Step 5: List all files, including hidden files
      - name: List repository files
        run: |
          echo "=================================="
          echo "ALL FILES"
          echo "=================================="
          find . -path './.git' -prune -o -type f -print

      # Step 6: Display Git information
      - name: Show Git status
        run: |
          echo "=================================="
          echo "GIT INFORMATION"
          echo "=================================="
          git status
          echo ""
          echo "Current commit:"
          git log -1 --oneline
          echo ""
          echo "Current branch:"
          git branch --show-current
